# Runs the demo and the tests on every operating system the README promises.
name: demo

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac-linux:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: make demo
      - run: make test

  windows-wsl:
    name: Windows · WSL Ubuntu
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Preparing WSL on the runner sometimes hangs. Limit it and try once more before failing the job.
      - id: wsl
        uses: Vampire/setup-wsl@v7
        timeout-minutes: 8
        continue-on-error: true
        with:
          distribution: Ubuntu-24.04
          additional-packages: git make python3-venv
      - name: set up WSL, second attempt
        if: steps.wsl.outcome != 'success'
        uses: Vampire/setup-wsl@v7
        timeout-minutes: 10
        with:
          distribution: Ubuntu-24.04
          additional-packages: git make python3-venv
      - name: clone and make demo, as the README says
        shell: wsl-bash {0}
        run: |
          cd ~
          git clone --branch "${{ github.ref_name }}" "https://github.com/${{ github.repository }}.git" portfolio
          cd portfolio
          python3 --version
          make demo
